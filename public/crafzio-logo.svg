<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dark circular background -->
  <circle cx="50" cy="50" r="50" fill="#0d1b2a"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <!-- Inner background circle -->
  <circle cx="50" cy="50" r="38" fill="#0a1628"/>
  
  <!-- Binary pattern dots around edge -->
  <g fill="#0e8a8a" opacity="0.4" font-size="3.5" font-family="monospace">
    <text x="14" y="30" transform="rotate(-60 50 50)">101</text>
    <text x="14" y="30" transform="rotate(-30 50 50)">010</text>
    <text x="14" y="30" transform="rotate(0 50 50)">110</text>
    <text x="14" y="30" transform="rotate(30 50 50)">001</text>
    <text x="14" y="30" transform="rotate(60 50 50)">100</text>
    <text x="14" y="30" transform="rotate(90 50 50)">011</text>
    <text x="14" y="30" transform="rotate(120 50 50)">101</text>
    <text x="14" y="30" transform="rotate(150 50 50)">010</text>
    <text x="14" y="30" transform="rotate(180 50 50)">110</text>
    <text x="14" y="30" transform="rotate(210 50 50)">001</text>
    <text x="14" y="30" transform="rotate(240 50 50)">100</text>
    <text x="14" y="30" transform="rotate(270 50 50)">011</text>
  </g>

  <!-- CRAFZIO text at top arc -->
  <path id="topArc" d="M 15,50 A 35,35 0 0,1 85,50" fill="none"/>
  <text font-size="8" font-family="Arial, sans-serif" font-weight="bold" fill="white" letter-spacing="2">
    <textPath href="#topArc" startOffset="15%">CRAFZIO</textPath>
  </text>

  <!-- Large C in white -->
  <path d="M 58,28 A 22,22 0 1,0 58,72 L 58,65 A 15,15 0 1,1 58,35 Z" fill="white"/>

  <!-- CZ lightning bolt in cyan/teal gradient -->
  <defs>
    <linearGradient id="czGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#0077ff"/>
      <stop offset="100%" style="stop-color:#00a8a8"/>
    </linearGradient>
  </defs>
  <!-- Lightning Z shape -->
  <polygon points="48,30 62,30 50,50 62,50 48,70 42,70 54,50 42,50" fill="url(#czGrad)"/>

  <!-- CRAFZIO text at bottom -->
  <path id="botArc" d="M 14,55 A 36,36 0 0,0 86,55" fill="none"/>
  <text font-size="7.5" font-family="Arial, sans-serif" font-weight="bold" fill="#00d4ff" letter-spacing="2">
    <textPath href="#botArc" startOffset="12%">CRAFZIO</textPath>
  </text>
</svg>
